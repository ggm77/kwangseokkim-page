      <main style="font-family:sans-serif;max-width:700px;margin:2rem auto;padding:0 1rem;color:#222">
        <h1>김광석 다시부르기 | 가객의 앨범들</h1>
        <p>김광석(가객)의 6장 앨범을 LP·카세트 형식으로 감상하는 아카이브입니다.<br>
           빨리 감기도, 다음 곡 버튼도 없습니다. 그가 한 장에 담아 건넨 순서 그대로 목소리를 마주합니다.</p>
        <section>
          <h2>수록 앨범</h2>
          <ul>
            <li><strong>김광석 1</strong> (1989) — 너에게, 내 꿈, 그대 웃음소리, 슬픈 우연, 안녕 친구여, 내 마음의 문을 열어줘, 기다려줘, 창, 아스팔트 열기 속에서</li>
            <li><strong>김광석 2nd</strong> (1991) — 사랑했지만, 꽃, 사랑이라는 이유로, 마음의 이야기, 너 하나뿐임을, 슬픈 노래, 그날들, 추억, 마음속의 풍경, 다시 아침</li>
            <li><strong>김광석 3번째 노래모음</strong> (1992) — 나의 노래, 잊어야 한다는 마음으로, 나른한 오후, 외사랑, 나무, 기대어 앉은 오후에는, 행복의 문</li>
            <li><strong>김광석 네번째</strong> (1994) — 일어나, 바람이 불어오는 곳, 너무 아픈 사랑은 사랑이 아니었음을, 서른 즈음에, 혼자 남은밤, 끊어진 길, 자유롭게</li>
            <li><strong>다시 부르기 1</strong> (1993) — 이등병의 편지, 거리에서, 말하지 못한 내 사랑, 그루터기, 흐린 가을 하늘에 편지를 써, 광야에서</li>
            <li><strong>다시 부르기 2</strong> (1995) — 바람과 나, 그녀가 처음 울던 날, 두바퀴로 가는 자동차, 잊혀지는 것, 불행아, 어느 60대 노부부 이야기, 내 사람이여, 변해가네</li>
          </ul>
        </section>
